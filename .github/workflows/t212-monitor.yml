name: T212 Market Monitor (Telegram Alerts)

on:
  schedule:
    # Hourly at :17 past the hour (off-peak minute avoids :00/:30 GitHub queue drops), Mon-Fri US market hours
    - cron: "17 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_analysis:
        description: "Force analysis briefing and ignore market hours (for testing)"
        required: false
        type: boolean
        default: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t212-analyst

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: t212-analyst/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite state cache
        uses: actions/cache/restore@v4
        with:
          path: t212-analyst/data
          key: t212-db-${{ github.run_id }}
          restore-keys: |
            t212-db-

      - name: Run T212 Monitor
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_ENV: ${{ secrets.T212_ENV || 'demo' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
          MARKET_HOURS_ONLY: "true"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_analysis }}" = "true" ]; then
            python monitor.py --once --ignore-market-hours --force-analysis
          else
            python monitor.py --once
          fi

      - name: Save SQLite state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: t212-analyst/data
          key: t212-db-${{ github.run_id }}
